[package]
name = "omnifeed"
version = "0.9.2"
description = "Omnifeed Desktop - Real-Time News & Sentiment Intelligence Hub"
authors = ["Robert Pelloni", "Omnifeed Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
